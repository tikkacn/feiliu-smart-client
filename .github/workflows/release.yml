name: Feiliu Smart Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag to publish or retry (for example v2.5.4)'
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write
  issues: write

env:
  CARGO_INCREMENTAL: 0
  HUSKY: 0
  RUST_BACKTRACE: short
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

concurrency:
  group: '${{ github.workflow }}-${{ inputs.tag || github.ref_name }}'
  cancel-in-progress: false

jobs:
  check:
    name: Verify release tag
    runs-on: ubuntu-latest
    outputs:
      commit_sha: ${{ steps.verify.outputs.commit_sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && github.ref || github.ref_name }}

      - uses: pnpm/action-setup@v6
        with:
          run_install: false

      - uses: actions/setup-node@v7
        with:
          node-version: '24.19.0'
          cache: pnpm

      - name: Verify tag, version, branch and customizations
        id: verify
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo 'Invalid release tag.'
            exit 1
          fi
          if git show-ref --verify --quiet "refs/tags/${RELEASE_TAG}"; then
            git checkout --detach "refs/tags/${RELEASE_TAG}"
          fi
          package_version="$(node -p "require('./package.json').version")"
          expected_tag="v${package_version}"
          if [ "${RELEASE_TAG}" != "${expected_tag}" ]; then
            echo "Tag ${RELEASE_TAG} does not match package version ${expected_tag}."
            exit 1
          fi

          git fetch origin "${{ github.event.repository.default_branch }}"
          if ! git merge-base --is-ancestor HEAD "origin/${{ github.event.repository.default_branch }}"; then
            echo "The release tag must point to the default branch."
            exit 1
          fi

          pnpm install --frozen-lockfile
          pnpm custom:verify
          pnpm format:check
          pnpm typecheck
          pnpm lint
          pnpm test
          pnpm workflow:check
          echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  prepare:
    name: Prepare draft release
    needs: check
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.release.outputs.id }}
    steps:
      - name: Create draft release
        id: release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ needs.check.outputs.commit_sha }}
          name: '飞流 Smart 客户端 ${{ env.RELEASE_TAG }}'
          body: '正在构建 Windows 与 macOS 安装包。'
          draft: true
          prerelease: ${{ contains(env.RELEASE_TAG, '-') }}

  build:
    name: Build ${{ matrix.label }}
    needs: [check, prepare]
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            attest_path: target/x86_64-pc-windows-msvc/release/bundle/nsis/*setup.exe
          - label: macOS Apple Silicon
            os: macos-latest
            target: aarch64-apple-darwin
            attest_path: target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          - label: macOS Intel
            os: macos-latest
            target: x86_64-apple-darwin
            attest_path: target/x86_64-apple-darwin/release/bundle/dmg/*.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.check.outputs.commit_sha }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.95.0'
          targets: ${{ matrix.target }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: feiliu-release
          key: '${{ runner.os }}-${{ matrix.target }}'
          workspaces: |
            . -> target

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.19.0'
          cache: pnpm

      - name: Install dependencies and sidecars
        run: |
          pnpm install --frozen-lockfile
          pnpm run prebuild ${{ matrix.target }}

      - name: Configure optional Apple signing
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$APPLE_CERTIFICATE" ] || [ -n "$APPLE_SIGNING_IDENTITY" ]; then
            if [ -z "$APPLE_CERTIFICATE" ] || [ -z "$APPLE_SIGNING_IDENTITY" ]; then
              echo 'Apple signing requires both a certificate and signing identity.'
              exit 1
            fi
            for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
              value="${!name}"
              if [ -n "$value" ]; then
                printf '%s<<FEILIU_SIGNING_VALUE\n%s\nFEILIU_SIGNING_VALUE\n' "$name" "$value" >> "$GITHUB_ENV"
              fi
            done
          else
            echo 'No Developer ID certificate configured; using ad-hoc signing without notarization.'
            echo 'APPLE_SIGNING_IDENTITY=-' >> "$GITHUB_ENV"
          fi

      - name: Build and upload installer
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_OPTIONS: '--max_old_space_size=4096'
        with:
          releaseId: ${{ needs.prepare.outputs.release_id }}
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: '飞流 Smart 客户端 ${{ env.RELEASE_TAG }}'
          releaseBody: 'Windows x64 与 macOS 双架构备选客户端。'
          tauriScript: pnpm
          args: --target ${{ matrix.target }}
          includeUpdaterJson: false

      - name: Attest installer
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: ${{ matrix.attest_path }}

  publish:
    name: Publish release
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - name: Publish completed release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
          PRERELEASE: ${{ contains(env.RELEASE_TAG, '-') }}
        shell: bash
        run: |
          cat > release-notes.md <<'EOF'
          飞流 Smart 客户端备选版本。

          - Windows x64：仅建议具备一定学习能力和软件配置经验的老手使用。
          - macOS Intel：未测试，请谨慎使用。未配置 Apple 开发者证书时使用临时签名，未经 Apple 公证，可能出现系统安全提示。
          - macOS Apple 芯片：未测试，请谨慎使用。未配置 Apple 开发者证书时使用临时签名，未经 Apple 公证，可能出现系统安全提示。
          - 客户端不会自动升级；请在软件内手动检查更新。

          教程和下载说明：https://guide.uutec.net
          EOF

          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" \
            -f name="飞流 Smart 客户端 ${RELEASE_TAG}" \
            -F body=@release-notes.md \
            -F draft=false \
            -F prerelease="${PRERELEASE}" \
            --silent

  report_failure:
    name: Report a failed release
    if: failure()
    needs: [check, prepare, build, publish]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v8
        with:
          script: |
            await github.rest.issues.create({
              ...context.repo,
              title: `飞流发布 ${process.env.RELEASE_TAG} 构建失败`,
              body: `安装包未全部通过构建，不应同步到网站。请检查并通过手动发布工作流重试。\n\n${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            })

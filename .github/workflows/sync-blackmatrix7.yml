name: Sync Blackmatrix7 Rules

on:
  schedule:
    - cron: '43 */12 * * *'
  workflow_dispatch:
    inputs:
      environment:
        description: Target GitHub Environment
        required: true
        default: staging
        type: choice
        options:
          - staging
          - production

permissions:
  contents: read

env:
  HUSKY: 0

concurrency:
  group: feiliu-blackmatrix7-sync-${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'staging' }}
  cancel-in-progress: false

jobs:
  sync:
    name: Sync Blackmatrix7 rules
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'staging' }}
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      BLACKMATRIX7_SOURCE_URL: ${{ vars.BLACKMATRIX7_SOURCE_URL }}
      BLACKMATRIX7_SOURCE_NAME: ${{ vars.BLACKMATRIX7_SOURCE_NAME || 'blackmatrix7' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: '24.19.0'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check sync configuration
        id: config
        shell: bash
        run: |
          if [[ -z "$DATABASE_URL" || -z "$BLACKMATRIX7_SOURCE_URL" ]]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Blackmatrix7 sync is not configured for this environment; skipping."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run Blackmatrix7 sync
        if: steps.config.outputs.configured == 'true'
        run: pnpm --filter @feiliu/sync-worker sync:blackmatrix7

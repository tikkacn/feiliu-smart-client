name: Migrate control-plane database

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target GitHub Environment
        required: true
        default: staging
        type: choice
        options:
          - staging
          - production

permissions:
  contents: read

concurrency:
  group: database-migration-${{ inputs.environment || 'staging' }}
  cancel-in-progress: false

jobs:
  migrate:
    name: Apply PostgreSQL migrations
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'staging' }}
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Skip when database is not configured
        if: ${{ env.DATABASE_URL == '' }}
        run: echo "DATABASE_URL is not configured; migration skipped."

      - name: Checkout repository
        if: ${{ env.DATABASE_URL != '' }}
        uses: actions/checkout@v7

      - name: Install pnpm
        if: ${{ env.DATABASE_URL != '' }}
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Install Node
        if: ${{ env.DATABASE_URL != '' }}
        uses: actions/setup-node@v7
        with:
          node-version: '24.19.0'
          cache: pnpm

      - name: Install dependencies
        if: ${{ env.DATABASE_URL != '' }}
        run: pnpm install --frozen-lockfile

      - name: Apply migrations
        if: ${{ env.DATABASE_URL != '' }}
        run: pnpm --filter @feiliu/sync-worker db:migrate

name: Control-plane Fixture Demo

on:
  push:
    branches:
      - dev
    paths:
      - 'apps/control-plane-api/**'
      - 'packages/strategy-engine/**'
      - 'policy/fixtures/**'
      - 'deploy/control-plane/**'
      - '.dockerignore'
      - '.github/workflows/fixture-demo.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fixture:
    name: Run redacted fixture container
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build fixture image
        run: docker build --tag feiliu-control-plane-fixture --file deploy/control-plane/Dockerfile .

      - name: Start fixture container
        run: docker run --detach --name feiliu-control-plane-fixture --publish 8787:8787 --env NODE_ENV=development feiliu-control-plane-fixture

      - name: Wait for health endpoint
        shell: bash
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8787/v1/health > /tmp/health.json; then
              cat /tmp/health.json
              exit 0
            fi
            sleep 2
          done
          docker logs feiliu-control-plane-fixture
          exit 1

      - name: Verify fixture manifest and config
        shell: bash
        run: |
          curl --fail --silent http://127.0.0.1:8787/v1/client/manifest > /tmp/manifest.json
          curl --fail --silent http://127.0.0.1:8787/v1/client/config > /tmp/config.json
          grep --fixed-strings --quiet 'policy-2026-08-25.1' /tmp/manifest.json
          grep --fixed-strings --quiet 'telecom-openai' /tmp/config.json

      - name: Stop fixture container
        if: always()
        run: docker rm --force feiliu-control-plane-fixture
